<nav
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [class]="scrolled() ? 'bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-100' : 'bg-white/80 backdrop-blur-sm'"
>
  <div class="max-w-7xl mx-auto px-6 lg:px-10">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-0.5 group">
        <span class="text-xl font-bold tracking-widest text-teal-balsi transition-colors group-hover:text-teal-balsi-dark">BAL</span>
        <span class="text-xl font-bold tracking-widest text-oliva-balsi transition-colors group-hover:text-oliva-balsi-hover">SI</span>
        <span class="ml-2 text-[10px] font-medium tracking-[0.25em] text-gray-400 uppercase hidden sm:block">Optical Studio</span>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-8">
        <a
          routerLink="/"
          routerLinkActive="text-oliva-balsi"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-sm font-medium text-base-dark hover:text-oliva-balsi transition-colors tracking-wide"
        >Home</a>
        <a
          routerLink="/catalogo"
          routerLinkActive="text-oliva-balsi"
          class="text-sm font-medium text-base-dark hover:text-oliva-balsi transition-colors tracking-wide"
        >Catalogo</a>
        <a
          routerLink="/onboarding"
          routerLinkActive="text-oliva-balsi"
          class="text-sm font-medium text-base-dark hover:text-oliva-balsi transition-colors tracking-wide"
        >Onboarding</a>
      </div>

      <!-- Right Actions -->
      <div class="flex items-center gap-3">
        <!-- Cart -->
        <button class="relative p-2 text-accent-copper hover:text-oliva-balsi transition-colors" aria-label="Carrello">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
          </svg>
          <span
            class="absolute -top-0.5 -right-0.5 bg-oliva-balsi text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center leading-none">
            0
          </span>
        </button>

        <!-- CTA Desktop -->
        <a
          routerLink="/onboarding"
          class="hidden md:inline-flex items-center gap-2 px-4 py-2 bg-oliva-balsi text-white text-sm font-semibold tracking-wide rounded hover:bg-oliva-balsi-hover transition-colors"
        >
          Inizia
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        </a>

        <!-- Mobile Hamburger -->
        <button
          class="md:hidden p-2 text-base-dark hover:text-oliva-balsi transition-colors"
          (click)="toggleMobile()"
          aria-label="Menu"
        >
          @if (!mobileOpen()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    @if (mobileOpen()) {
      <div class="md:hidden border-t border-gray-100 py-4 flex flex-col gap-4">
        <a routerLink="/" (click)="toggleMobile()" class="text-sm font-medium text-base-dark hover:text-oliva-balsi transition-colors px-2">Home</a>
        <a routerLink="/catalogo" (click)="toggleMobile()" class="text-sm font-medium text-base-dark hover:text-oliva-balsi transition-colors px-2">Catalogo</a>
        <a routerLink="/onboarding" (click)="toggleMobile()" class="text-sm font-medium text-base-dark hover:text-oliva-balsi transition-colors px-2">Onboarding</a>
        <a
          routerLink="/onboarding"
          (click)="toggleMobile()"
          class="mx-2 text-center px-4 py-2.5 bg-oliva-balsi text-white text-sm font-semibold rounded hover:bg-oliva-balsi-hover transition-colors"
        >Inizia l'Onboarding</a>
      </div>
    }
  </div>
</nav>
