<nav
  class="fixed top-0 inset-x-0 z-50 transition-[background-color,backdrop-filter,box-shadow,border-color] duration-500 ease-out-expo"
  [class]="transparent
    ? 'bg-transparent border-b border-transparent'
    : 'bg-base-light/85 backdrop-blur-xl border-b border-black/5 shadow-[0_8px_30px_-18px_rgba(8,39,34,0.5)]'"
>
  <div class="w-full px-6 lg:px-12 2xl:px-20">
    <div class="flex items-center justify-between h-20">

      <!-- Logo orizzontale (UI Kit 2.1) — colore adattivo via currentColor -->
      <a
        routerLink="/"
        class="flex items-center group shrink-0"
        [class]="transparent ? 'text-white' : 'text-teal-balsi'"
        aria-label="Studio Ottico Balsi — Home"
      >
        <svg viewBox="0 0 560 80" class="h-8 lg:h-9 w-auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Studio Ottico Balsi">
          <text x="10" y="52" font-family="'Hanken Grotesk',sans-serif" font-size="27" font-weight="400" letter-spacing="6" fill="currentColor">STUDIO OTTICO</text>
          <line x1="328" y1="18" x2="328" y2="62" stroke="#2E8B75" stroke-width="2" />
          <text x="348" y="55" font-family="'Bricolage Grotesque','Hanken Grotesk',sans-serif" font-size="42" font-weight="800" letter-spacing="1" fill="#2E8B75">BALSI</text>
          <text x="515" y="32" font-family="'Hanken Grotesk',sans-serif" font-size="12" fill="currentColor">S</text>
          <text x="515" y="48" font-family="'Hanken Grotesk',sans-serif" font-size="12" fill="currentColor">N</text>
          <text x="515" y="64" font-family="'Hanken Grotesk',sans-serif" font-size="12" fill="currentColor">C</text>
        </svg>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden lg:flex items-center gap-9">
        @for (item of items; track item.link) {
          <a
            [routerLink]="item.link"
            routerLinkActive #rla="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            class="group relative text-[13px] font-medium tracking-wide transition-colors duration-300 py-1"
            [class]="transparent
              ? (rla.isActive ? 'text-white' : 'text-white/70 hover:text-white')
              : (rla.isActive ? 'text-oliva-balsi' : 'text-base-dark/80 hover:text-oliva-balsi')"
          >
            {{ item.label }}
            <span
              class="absolute -bottom-0.5 left-0 h-px bg-oliva-balsi transition-all duration-[400ms] ease-out-expo"
              [class]="rla.isActive ? 'w-full' : 'w-0 group-hover:w-full'"
            ></span>
          </a>
        }
      </div>

      <!-- Right Actions -->
      <div class="flex items-center gap-2 sm:gap-4">
        <a
          href="tel:+39049525625"
          class="hidden sm:inline-flex items-center gap-2 text-[13px] font-medium tracking-wide transition-colors duration-300"
          [class]="transparent ? 'text-white/70 hover:text-white' : 'text-base-dark/70 hover:text-oliva-balsi'"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
          </svg>
          <span class="nums">049 525625</span>
        </a>

        <!-- CTA Desktop -->
        <a
          routerLink="/contatti"
          class="sheen hidden lg:inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-[13px] font-semibold tracking-wide transition-all duration-300 ease-out-expo hover:-translate-y-0.5"
          [class]="transparent
            ? 'bg-white text-teal-balsi hover:bg-emerald-glow'
            : 'bg-oliva-balsi text-white hover:bg-oliva-balsi-hover'"
        >
          Prenota visita
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        </a>

        <!-- Mobile Hamburger -->
        <button
          class="lg:hidden inline-flex items-center justify-center w-11 h-11 -mr-2 rounded-full transition-colors"
          [class]="transparent ? 'text-white hover:bg-white/10' : 'text-teal-balsi hover:bg-teal-balsi/5'"
          (click)="toggleMobile()"
          [attr.aria-expanded]="mobileOpen()"
          aria-label="Apri menu"
        >
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- ── Mobile Overlay ────────────────────────────────────────────────── -->
@if (mobileOpen()) {
  <div
    class="fixed inset-0 z-[60] lg:hidden flex flex-col bg-gradient-to-b from-teal-balsi to-forest-900 text-white nav-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Menu di navigazione"
  >
    <!-- glow decorativo -->
    <div class="lens-glow absolute -top-24 -right-16 w-72 h-72 rounded-full opacity-40 pointer-events-none" aria-hidden="true"></div>

    <div class="flex items-center justify-between h-20 px-6">
      <span class="font-display text-xl font-extrabold tracking-tight">
        <span class="text-white/60 font-sans font-normal text-sm tracking-[0.3em] uppercase">Studio Ottico</span>
        <span class="ml-2 text-emerald-glow">BALSI</span>
      </span>
      <button
        class="inline-flex items-center justify-center w-11 h-11 -mr-2 rounded-full text-white hover:bg-white/10 transition-colors"
        (click)="closeMobile()"
        aria-label="Chiudi menu"
      >
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <nav class="flex-1 flex flex-col justify-center px-8 gap-1">
      @for (item of items; track item.link; let i = $index) {
        <a
          [routerLink]="item.link"
          (click)="closeMobile()"
          class="nav-overlay-item group flex items-center justify-between py-4 border-b border-white/10"
          [style.--reveal-delay.ms]="80 + i * 70"
        >
          <span class="font-display text-3xl font-bold tracking-tight">{{ item.label }}</span>
          <svg class="h-5 w-5 text-emerald-glow opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        </a>
      }
    </nav>

    <div class="px-8 pb-10">
      <a
        routerLink="/contatti"
        (click)="closeMobile()"
        class="flex items-center justify-center gap-2 w-full px-6 py-4 rounded-full bg-oliva-balsi text-white font-semibold tracking-wide hover:bg-oliva-balsi-hover transition-colors"
      >
        Prenota una visita
      </a>
      <a href="tel:+39049525625" class="block text-center mt-4 text-sm text-white/60 nums">+39 049 525625</a>
    </div>
  </div>
}
