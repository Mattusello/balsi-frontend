<!-- ─── CONTATTI ────────────────────────────────────────────────────── -->
<section id="contatti" class="min-h-screen pt-32 pb-24 bg-white">
  <div class="max-w-7xl mx-auto px-6 lg:px-10">

    <!-- Section Header -->
    <div class="text-center mb-14">
      <span class="text-xs font-semibold tracking-[0.25em] uppercase text-oliva-balsi">Contatti</span>
      <h1 class="text-3xl lg:text-4xl font-bold text-base-dark mt-2 tracking-tight">I nostri punti vendita</h1>
    </div>

    <!-- Stores Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      @for (store of stores; track store.name) {
        <article class="rounded-2xl overflow-hidden border border-gray-100 bg-white hover:shadow-xl hover:shadow-oliva-balsi/10 transition-all duration-300">
          <!-- Map -->
          <div class="h-64 bg-gray-50">
            <iframe
              [src]="store.mapUrl"
              class="w-full h-full border-0"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              [title]="'Mappa ' + store.name"
            ></iframe>
          </div>
          <!-- Info -->
          <div class="p-6">
            <h2 class="text-lg font-bold text-teal-balsi tracking-tight mb-3">{{ store.name }}</h2>
            <div class="space-y-2 text-sm text-gray-500">
              <p class="flex items-start gap-2.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-oliva-balsi shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                </svg>
                <span>{{ store.address }}</span>
              </p>
              <p class="flex items-center gap-2.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-accent-copper shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
                </svg>
                <a [href]="'tel:' + store.phoneRaw" class="hover:text-teal-balsi transition-colors">{{ store.phone }}</a>
              </p>
            </div>
          </div>
        </article>
      }
    </div>

  </div>
</section>
